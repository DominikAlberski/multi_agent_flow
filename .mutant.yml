# Mutation tests: rake mutant. Mutant is free for open source projects.
# A subject needs a test class that covers it (`cover`), else all covered tests run.
usage: opensource
includes:
  - lib
requires:
  - maf
  - maf/shared/peak_rate
integration:
  name: minitest
matcher:
  subjects:
    - Maf::Shared::GitExclude*
    - Maf::Shared::GitIdentity*
    - Maf::Shared::PeakRate*
    - Maf::Shared::Processes*
    - Maf::Shared::Project*
    - Maf::Flow::CodexHooks*
    - Maf::Flow::LegacyCodexHook*
    - Maf::Uninstall::CodexHooks*
